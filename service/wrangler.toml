name = "fc-timers"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ROLE_ID = "1566210740170399855"
# App do Discord (FC Companion): ID e chave pública não são segredo. O servidor é o único que pode usar os comandos.
DISCORD_APP_ID = "1574112157577117718"
DISCORD_PUBLIC_KEY = "18071ee6dcc9a0926c51f499f4ace0ec214b4c9fbf3e6a582a0e598335db5d18"
# TESTE: liga os botões de teste no /fcc e no plugin. Tirar depois da fase de testes.
TEST_TOOLS = "1"
DISCORD_GUILD_ID = "1128490333819392112"

# Segredos (wrangler secret put): FC_KEY, DISCORD_WEBHOOK e, para o bot, DISCORD_BOT_TOKEN.

[[durable_objects.bindings]]
name = "FC_STATE"
class_name = "FcState"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FcState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registry"]
