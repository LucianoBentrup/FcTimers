# Roda os testes e compila o plugin a cada envio. Um ❌ aqui significa: não publicar.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  service:
    name: Serviço (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm test

  plugin-tests:
    name: Plugin (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/FcTimers.Tests

  plugin-build:
    name: Plugin (compilação)
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}\dalamud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Baixar o Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath $env:DALAMUD_HOME
      - run: dotnet build FcTimers.csproj -c Release
